plugins {
    id 'java'
    id 'com.gradleup.shadow' version '9.0.0'
}

group = 'me.redot.grin'
version = '1.0.0'

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.jline:jline:4.4.2'

    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.jar {
    enabled = false
}

def agentJar = project(':agent').tasks.named('shadowJar')

tasks.named('processResources') {
    dependsOn agentJar
    from(agentJar.flatMap { it.archiveFile }) { into '' }
}

shadowJar {
    archiveClassifier = ''
    mergeServiceFiles()

    manifest {
        attributes('Main-Class': 'me.redot.grin.core.GrinCli')
    }
}

test {
    useJUnitPlatform()
}
