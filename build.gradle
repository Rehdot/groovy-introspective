plugins {
    id 'groovy'
}

group = 'me.redot'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.apache.groovy:groovy:5.0.8'
    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}

def grinUserHome = System.getenv('USERPROFILE') ?: System.getProperty('user.home')
def grinInstallDirectory = file("${grinUserHome}/.grin/bin")

tasks.register('installGrin', Copy) {
    group = 'grin'
    description = 'Rebuilds agent and core, then installs the core JAR in ~/.grin/bin.'

    dependsOn ':agent:shadowJar', ':core:jar'
    from { project(':core').tasks.named('jar').get().archiveFile.get().asFile }
    into grinInstallDirectory

    doLast {
        logger.lifecycle("Installed grin in ${grinInstallDirectory}")
    }
}

gradle.projectsEvaluated {
    def agentJar = project(':agent').tasks.named('shadowJar')
    def coreCompile = project(':core').tasks.named('compileJava')
    def coreJar = project(':core').tasks.named('jar')

    coreCompile.configure { mustRunAfter agentJar }
    coreJar.configure { mustRunAfter agentJar }
}

gradle.taskGraph.whenReady { graph ->
    if (graph.hasTask(tasks.named('installGrin').get())) {
        graph.allTasks.findAll { task ->
            task.project == project(':agent') || task.project == project(':core')
        }.each { task ->
            task.outputs.upToDateWhen { false }
            task.outputs.doNotCacheIf('installGrin always builds current sources') { true }
        }
    }
}
